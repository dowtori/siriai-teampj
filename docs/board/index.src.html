<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIRIAI 시스템 구조 보드</title>
<style>
/*__FONTFACES__*/

:root{
  --paper:#f4f2ed;
  --card:#ffffff;
  --card-2:#faf9f6;
  --ink:#26221c;
  --ink-2:rgba(38,34,28,.66);
  --ink-3:rgba(38,34,28,.44);
  --line:rgba(38,34,28,.14);
  --line-2:rgba(38,34,28,.07);
  --line-3:rgba(38,34,28,.30);
  --accent:#4d4da7;
  --accent-ink:#3d3d8c;
  --accent-soft:rgba(77,77,167,.10);
  --z-src:#9a9184;
  --z-src-soft:rgba(154,145,132,.10);
  --z-db:#4d4da7;
  --z-db-soft:rgba(77,77,167,.10);
  --z-be:#3f6b9e;
  --z-be-soft:rgba(63,107,158,.10);
  --z-ui:#a75f42;
  --z-ui-soft:rgba(167,95,66,.10);
  --shadow:0 1px 2px rgba(38,34,28,.04),0 10px 30px rgba(38,34,28,.06);
  --lift:0 2px 4px rgba(38,34,28,.06),0 14px 34px rgba(38,34,28,.11);
  --ease:cubic-bezier(.22,1,.36,1);
  --kr:'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,sans-serif;
  --lt:'Inter Tight','Pretendard',Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#16140f;--card:#1e1b15;--card-2:#242119;
    --ink:#f1ede4;--ink-2:rgba(241,237,228,.63);--ink-3:rgba(241,237,228,.41);
    --line:rgba(241,237,228,.15);--line-2:rgba(241,237,228,.08);--line-3:rgba(241,237,228,.30);
    --accent:#9c9cee;--accent-ink:#b4b4f4;--accent-soft:rgba(156,156,238,.13);
    --z-src:#8d8477;--z-src-soft:rgba(141,132,119,.13);
    --z-db:#9c9cee;--z-db-soft:rgba(156,156,238,.13);
    --z-be:#85b0e0;--z-be-soft:rgba(133,176,224,.13);
    --z-ui:#e09b78;--z-ui-soft:rgba(224,155,120,.13);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.3);
    --lift:0 2px 4px rgba(0,0,0,.35),0 14px 34px rgba(0,0,0,.42);
  }
}
:root[data-theme="dark"]{
  --paper:#16140f;--card:#1e1b15;--card-2:#242119;
  --ink:#f1ede4;--ink-2:rgba(241,237,228,.63);--ink-3:rgba(241,237,228,.41);
  --line:rgba(241,237,228,.15);--line-2:rgba(241,237,228,.08);--line-3:rgba(241,237,228,.30);
  --accent:#9c9cee;--accent-ink:#b4b4f4;--accent-soft:rgba(156,156,238,.13);
  --z-src:#8d8477;--z-src-soft:rgba(141,132,119,.13);
  --z-db:#9c9cee;--z-db-soft:rgba(156,156,238,.13);
  --z-be:#85b0e0;--z-be-soft:rgba(133,176,224,.13);
  --z-ui:#e09b78;--z-ui-soft:rgba(224,155,120,.13);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.3);
  --lift:0 2px 4px rgba(0,0,0,.35),0 14px 34px rgba(0,0,0,.42);
}

*{box-sizing:border-box}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--kr);letter-spacing:-.01em;line-height:1.6;
  word-break:keep-all;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:clamp(12px,2.2vw,32px);
}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ═══ board ═══ */
.board{
  container-type:inline-size;
  width:100%;max-width:1480px;aspect-ratio:16/9;
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow);padding:2.1cqw 2.4cqw;
  display:flex;flex-direction:column;gap:1.35cqw;overflow:hidden;
}

/* ── header ── */
.hd{display:flex;align-items:baseline;gap:1.2cqw;flex:none}
.hd .mk{font-family:var(--lt);font-weight:600;font-size:max(11px,.95cqw);letter-spacing:.26em}
.hd .ti{
  font-size:max(13px,1.18cqw);font-weight:600;letter-spacing:-.028em;
  padding-left:1.2cqw;border-left:1px solid var(--line);
}
.hd .hint{
  margin-left:auto;font-family:var(--lt);font-size:max(9px,.66cqw);font-weight:500;
  letter-spacing:.14em;color:var(--ink-3);white-space:nowrap;
}


/* ── 목표 띠 ── */
.goals{flex:none;display:flex;align-items:center;gap:.7cqw;flex-wrap:wrap;
  padding-bottom:1.1cqw;border-bottom:1px dashed var(--line)}
.goals .gh2{font-family:var(--lt);font-size:max(9px,.66cqw);font-weight:500;
  letter-spacing:.16em;color:var(--ink-3);margin-right:.4cqw}
.goals .gd{
  appearance:none;font:inherit;color:var(--ink-2);cursor:pointer;
  display:inline-flex;align-items:center;gap:.55cqw;
  background:var(--card-2);border:1px solid var(--line);border-radius:100px;
  padding:.45cqw 1cqw;font-size:max(10.5px,.86cqw);font-weight:600;letter-spacing:-.02em;
  transition:background .18s var(--ease),border-color .18s var(--ease),color .18s var(--ease);
}
.goals .gd i{font-family:var(--lt);font-style:normal;font-size:max(8.5px,.62cqw);
  font-weight:600;letter-spacing:.1em;color:var(--accent)}
.goals .gd:hover,.goals .gd.pin{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.board.dim .goals .gd:not(:hover):not(.pin){opacity:.38}

/* ── map ── */
.map{flex:1 1 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:2.6cqw;min-height:0}
.zone{display:flex;flex-direction:column;gap:.9cqw;min-width:0}
.zh{
  font-family:var(--lt);font-size:max(9px,.66cqw);font-weight:500;letter-spacing:.16em;
  color:var(--zc,var(--ink-3));display:flex;align-items:center;gap:.5cqw;flex:none;
}
.zh::before{content:"";width:.42cqw;height:.42cqw;min-width:4px;min-height:4px;border-radius:50%;background:var(--zc,var(--ink-3))}
.zb{
  flex:1;display:flex;flex-direction:column;justify-content:center;gap:.85cqw;
  position:relative;min-height:0;
}
.zb::before{
  content:"";position:absolute;top:50%;left:-2.6cqw;width:1.9cqw;height:1px;
  background:var(--line-3);transform:translateY(-50%);
}
.zb::after{
  content:"";position:absolute;top:50%;left:-.75cqw;
  border-left:.5cqw solid var(--line-3);
  border-top:.3cqw solid transparent;border-bottom:.3cqw solid transparent;
  transform:translateY(-50%);
}
.zone:first-child .zb::before,.zone:first-child .zb::after{display:none}

/* ── node ── */
.nd{
  appearance:none;font:inherit;color:inherit;text-align:left;cursor:pointer;
  background:var(--card-2);border:1px solid var(--line);border-radius:.65cqw;
  padding:.72cqw 1cqw;display:flex;flex-direction:column;gap:.14cqw;min-width:0;flex:0 0 auto;
  transition:background .18s var(--ease),border-color .18s var(--ease),
             box-shadow .18s var(--ease),transform .18s var(--ease),opacity .18s var(--ease);
}
.nd .t{font-size:max(11.5px,1.02cqw);font-weight:600;letter-spacing:-.024em;line-height:1.25}
.nd .s{font-size:max(9.5px,.76cqw);font-weight:400;letter-spacing:-.006em;color:var(--ink-3);line-height:1.3}
.nd:hover,.nd:focus-visible{
  background:var(--zs);border-color:var(--zc);box-shadow:var(--lift);transform:translateY(-1px);
}
.nd.pin{background:var(--zs);border-color:var(--zc);border-width:1.5px;box-shadow:var(--lift)}
.nd.pin .t{color:var(--zc)}
.board.dim .nd:not(:hover):not(.pin){opacity:.38}
.board.dim .zb::before,.board.dim .zb::after{opacity:.4}

.zone[data-z="src"]{--zc:var(--z-src);--zs:var(--z-src-soft)}
.zone[data-z="db"]{--zc:var(--z-db);--zs:var(--z-db-soft)}
.zone[data-z="be"]{--zc:var(--z-be);--zs:var(--z-be-soft)}
.zone[data-z="ui"]{--zc:var(--z-ui);--zs:var(--z-ui-soft)}
.zone[data-z="src"] .nd{border-style:dashed}
.zone[data-z="db"] .nd[data-k="b3"]{background:var(--z-db-soft);border-color:var(--z-db)}

/* ── rail ── */
.rail{flex:0 0 auto;display:flex;flex-direction:column;gap:.6cqw;padding-top:1.1cqw;border-top:1px dashed var(--line)}
.rail-h{font-family:var(--lt);font-size:max(9px,.66cqw);font-weight:500;letter-spacing:.16em;color:var(--ink-3)}
.rail-b{display:grid;grid-template-columns:repeat(5,1fr);gap:.9cqw}
.rail .nd{--zc:var(--ink-3);--zs:var(--line-2);background:transparent;border-color:var(--line-2)}

/* ── detail ── */
.det{
  flex:0 0 auto;height:11.6cqw;min-height:132px;
  background:var(--card-2);border:1px solid var(--line);border-radius:.8cqw;
  padding:1.15cqw 1.5cqw;display:grid;grid-template-columns:15cqw 1fr;gap:1.6cqw;
  border-left:3px solid var(--dc,var(--line-3));overflow:hidden;
}
.det-l{display:flex;flex-direction:column;gap:.3cqw;min-width:0}
.det-z{
  font-family:var(--lt);font-size:max(9px,.64cqw);font-weight:500;letter-spacing:.16em;
  color:var(--dc,var(--ink-3));display:flex;align-items:center;gap:.5cqw;
}
.det-z .chip{
  font-size:max(8px,.56cqw);letter-spacing:.1em;padding:.15cqw .45cqw;border-radius:3px;
  background:var(--accent-soft);color:var(--accent-ink);
}
.det-t{font-size:max(14px,1.32cqw);font-weight:700;letter-spacing:-.032em;line-height:1.2;margin-top:.15cqw}
.det-m{font-family:var(--lt);font-size:max(10px,.76cqw);color:var(--ink-3);letter-spacing:-.004em;line-height:1.35}
.det-r{
  columns:2;column-gap:2cqw;align-content:start;min-width:0;overflow:hidden;
}
.det-r p{
  margin:0 0 .55cqw;font-size:max(10.5px,.82cqw);line-height:1.5;color:var(--ink-2);
  letter-spacing:-.008em;padding-left:.9cqw;position:relative;break-inside:avoid;
}
.det-r p::before{
  content:"";position:absolute;left:0;top:.62em;width:.38cqw;min-width:4px;height:1px;background:var(--line-3);
}
.det-r p strong{color:var(--ink);font-weight:600}
.det-r p.hl{color:var(--ink)}
.det-r p.hl::before{background:var(--dc,var(--line-3));height:2px;top:.58em}

@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}

/* ── 좁은 화면: 슬라이드 비율 해제 ── */
@media(max-width:900px){
  body{align-items:flex-start;padding:12px}
  .board{aspect-ratio:auto;padding:20px;gap:18px;max-width:none}
  .map{grid-template-columns:1fr 1fr;gap:26px}
  .zb::before,.zb::after{display:none}
  .zb{gap:8px}
  .nd{border-radius:8px;padding:9px 11px;gap:2px}
  .rail-b{grid-template-columns:1fr 1fr}
  .det{height:auto;grid-template-columns:1fr;gap:14px;padding:16px;border-radius:10px}
  .det-r{columns:1;column-gap:0}
  .det-r p{margin-bottom:7px;padding-left:11px}
  .det-r p::before{width:5px}
  .hd .hint{display:none}
  .hd{flex-wrap:wrap;gap:10px}
  .hd .ti{padding-left:10px}
}
@media(max-width:560px){.map{grid-template-columns:1fr}.rail-b{grid-template-columns:1fr}}
</style>

<div class="board" id="board">

  <div class="hd">
    <span class="mk">SIRIAI</span>
    <span class="ti">서비스 시스템 구조</span>
    <span class="hint">마우스를 올리면 상세 · 클릭하면 고정</span>
  </div>

  <div class="goals">
    <span class="gh2">이번 프로젝트로 바꾸려는 것</span>
    <button class="gd" data-k="g1"><i>01</i>내부 운영 리소스 효율화</button>
    <button class="gd" data-k="g2"><i>02</i>고객사 경험 개선</button>
    <button class="gd" data-k="g3"><i>03</i>시스템 자산 확보</button>
  </div>

  <div class="map">

    <div class="zone" data-z="src">
      <div class="zh">현재 데이터 · 옮겨올 것</div>
      <div class="zb">
        <button class="nd" data-k="a1"><span class="t">마스터시트</span><span class="s">프로젝트관리 · 34컬럼</span></button>
        <button class="nd" data-k="a2"><span class="t">캠페인 진행시트</span><span class="s">브랜드별 통합 · 탭 = 회차</span></button>
        <button class="nd" data-k="a3"><span class="t">콘텐츠 검수시트</span><span class="s">3단계 체크리스트</span></button>
        <button class="nd" data-k="a4"><span class="t">인플루언서 로우데이터</span><span class="s">원본 20,347건</span></button>
      </div>
    </div>

    <div class="zone" data-z="db">
      <div class="zh">데이터베이스</div>
      <div class="zb">
        <button class="nd" data-k="b1"><span class="t">브랜드</span><span class="s">거래처 · 담당자 · 접근코드</span></button>
        <button class="nd" data-k="b2"><span class="t">캠페인</span><span class="s">일정 · 상태 · 산출물</span></button>
        <button class="nd" data-k="b3"><span class="t">캠페인 참여</span><span class="s">진행시트 한 줄 = 한 행</span></button>
        <button class="nd" data-k="b4"><span class="t">인플루언서</span><span class="s">사람 · 계정 · 개인정보</span></button>
        <button class="nd" data-k="b5"><span class="t">정산 · 감사로그</span><span class="s">계산서 발급일 기준</span></button>
      </div>
    </div>

    <div class="zone" data-z="be">
      <div class="zh">백엔드</div>
      <div class="zb">
        <button class="nd" data-k="c1"><span class="t">서버 · 업무 처리</span><span class="s">캠페인 · 정산 · 조회</span></button>
        <button class="nd" data-k="c2"><span class="t">권한 · 로그인</span><span class="s">권한 관리 · 개인 코드</span></button>
      </div>
    </div>

    <div class="zone" data-z="ui">
      <div class="zh">화면</div>
      <div class="zb">
        <button class="nd" data-k="d1"><span class="t">어드민</span><span class="s">내부 운영 전체</span></button>
        <button class="nd" data-k="d2"><span class="t">브랜드 페이지</span><span class="s">고객사 · 접근 코드 진입</span></button>
        <button class="nd" data-k="d3"><span class="t">인플루언서 페이지</span><span class="s">개인 코드 진입</span></button>
        <button class="nd" data-k="d4"><span class="t">캠페인 지원 페이지</span><span class="s">캠페인별 공개 랜딩</span></button>
      </div>
    </div>

  </div>

  <div class="rail">
    <div class="rail-h">인프라 · 외부 연동</div>
    <div class="rail-b">
      <button class="nd" data-k="r1"><span class="t">Vercel</span><span class="s">배포 · 프리뷰</span></button>
      <button class="nd" data-k="r2"><span class="t">Supabase</span><span class="s">DB · 인증 · 스토리지</span></button>
      <button class="nd" data-k="r3"><span class="t">GitHub</span><span class="s">저장소 · 코드리뷰 · CI</span></button>
      <button class="nd" data-k="r4"><span class="t">알림</span><span class="s">알림톡 · SMS · 이메일</span></button>
      <button class="nd" data-k="r5"><span class="t">회계</span><span class="s">세금계산서 · 입금</span></button>
    </div>
  </div>

  <div class="det" id="det"></div>
</div>

<script>
const Z = {
  src:{n:'현재 데이터 · 옮겨올 것',c:'var(--z-src)'},
  db :{n:'데이터베이스',c:'var(--z-db)'},
  be :{n:'백엔드',c:'var(--z-be)'},
  ui :{n:'화면',c:'var(--z-ui)'},
  inf:{n:'인프라 · 외부 연동',c:'var(--ink-3)'}
};

const D = {
  g1:{z:'db',t:'내부 운영 리소스 효율화',m:'손으로 옮겨 적는 일을 없앤다',b:[
    '지금은 캠페인 하나를 두고 마스터시트 · 진행시트 62탭 · 검수시트 · 슬랙 · 드라이브를 오갑니다.',
    ['같은 값을 사람이 여러 번 옮겨 적습니다 — 값이 옆 칸으로 밀린 행이 <strong>276건</strong>.',1],
    '오늘 할 일 한 화면에서 마감 · 리마인드 · 검수 · 정산을 체크로 끝냅니다.',
    '검수는 캠페인 안에서 건별로. 30건을 한 번에 통과시키거나 같은 사유로 되돌립니다.'
  ]},
  g2:{z:'be',t:'고객사 경험 개선',m:'시트 대신 고객사 화면에서 본다',b:[
    '지금은 진행시트 링크를 열어 보여드립니다. 보여드릴 것과 아닌 것이 같은 파일에 있습니다.',
    '접근 코드로 들어와 자기 캠페인만 봅니다. 6단계로 지금 어디인지 보입니다.',
    ['선정 인원을 <strong>사진 고르듯</strong> 골라 컨펌합니다.',1],
    '올라온 콘텐츠가 링크가 아니라 화면에 그대로 박힙니다.'
  ]},
  g3:{z:'ui',t:'시스템 자산 확보',m:'쌓인 것이 다음 캠페인의 출발점이 된다',b:[
    ['협업 인플루언서 <strong>5,818명</strong> · 참여 연결 <strong>14,875건</strong>을 계정 단위로 확보.',1],
    '마스터시트의 협업여부 컬럼은 전 건이 같은 값이라 진행시트를 되짚어 다시 만들었습니다.',
    '두 번 이상 1,912명, 여섯 번 이상인 단골 676명이 처음으로 드러납니다.',
    '조건으로 걸러 지원 페이지를 그 사람들에게만 노출합니다.'
  ]},

  a1:{z:'src',t:'마스터시트',m:'SIRIAI 프로젝트관리 · 34컬럼',b:[
    '캠페인 138건 (26년 2–8월). 모든 하위 시트 링크가 여기서 갈라집니다.',
    '4개 영역 — 프로젝트 정보 / 마감일정 관리 / 콘텐츠 업로드 관리 / 매출 영역',

const det = document.getElementById('det');
const board = document.getElementById('board');
let pinned = null;

function render(d, isPin){
  const z = d.z ? Z[d.z] : null;
  det.style.setProperty('--dc', z ? z.c : 'var(--line-3)');
  const rows = d.b.map(x => Array.isArray(x)
    ? `<p class="hl">${x[0]}</p>`
    : `<p>${x}</p>`).join('');
  det.innerHTML =
    `<div class="det-l">
       <div class="det-z">${z ? z.n : 'OVERVIEW'}${isPin ? '<span class="chip">고정</span>' : ''}</div>
       <div class="det-t">${d.t}</div>
       <div class="det-m">${d.m}</div>
     </div>
     <div class="det-r">${rows}</div>`;
}

function show(key, isPin){ render(key ? D[key] : HOME, !!isPin); }

document.querySelectorAll('.nd,.gd').forEach(n => {
  const k = n.dataset.k;
  n.addEventListener('mouseenter', () => { if(!pinned){ show(k); board.classList.add('dim'); } });
  n.addEventListener('focus',      () => { if(!pinned){ show(k); board.classList.add('dim'); } });
  n.addEventListener('click', () => {
    if(pinned === k){ unpin(); return; }
    document.querySelectorAll('.nd.pin,.gd.pin').forEach(e => e.classList.remove('pin'));
    pinned = k; n.classList.add('pin'); board.classList.add('dim'); show(k, true);
  });
});

function unpin(){
  pinned = null;
  document.querySelectorAll('.nd.pin,.gd.pin').forEach(e => e.classList.remove('pin'));
  board.classList.remove('dim');
  show(null);
}

document.querySelector('.goals').addEventListener('mouseleave', clearHover);
document.querySelector('.map').addEventListener('mouseleave', clearHover);
document.querySelector('.rail').addEventListener('mouseleave', clearHover);
function clearHover(){ if(!pinned){ board.classList.remove('dim'); show(null); } }

document.addEventListener('keydown', e => { if(e.key === 'Escape' && pinned) unpin(); });
board.addEventListener('click', e => { if(!e.target.closest('.nd,.gd') && pinned) unpin(); });

show(null);
</script>
